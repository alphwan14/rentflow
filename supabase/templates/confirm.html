<!doctype html>
<html>
  <body style="margin:0;background:#F6F7F9;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F7F9;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px">
            <tr><td style="padding:0 0 16px;font-size:17px;font-weight:600;color:#0F1115">RentFlow</td></tr>
            <tr>
              <td style="background:#FFFFFF;border:1px solid #E8EAEE;border-radius:16px;padding:24px">
                <h1 style="margin:0 0 16px;font-size:20px;line-height:1.3;color:#0F1115">Confirm your email</h1>
                <p style="margin:0 0 16px;font-size:15px;line-height:1.5;color:#0F1115">
                  Thanks for signing up. Tap the button to confirm your email and start tracking your rent.
                </p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#0E7A4F;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:500;padding:12px 20px;border-radius:12px">Confirm my email</a>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 0 0;font-size:13px;line-height:1.5;color:#6B7280">
                If you didn't sign up for RentFlow, you can ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
